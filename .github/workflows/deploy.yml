name: Deploy WeChat Miniprogram

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '2.0.0'
      desc:
        description: 'Version description'
        required: true
        default: 'UI redesign with Claymorphism style'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install yarn
        run: npm install -g yarn --unsafe-perm || true
        
      - name: Install wechat-miniprogram-ci
        run: yarn global add wechat-miniprogram-ci || npm install -g wechat-miniprogram-ci --unsafe-perm || true
          
      - name: Deploy to WeChat
        run: |
          echo "${{ secrets.WECHAT_PRIVATE_KEY }}" > private_key.pem
          npx wechat-miniprogram-ci upload \
            --appid ${{ secrets.WECHAT_APPID }} \
            --private-key ./private_key.pem \
            --version "${{ github.event.inputs.version || '2.0.0' }}" \
            --desc "${{ github.event.inputs.desc || 'UI redesign' }}" \
            --project ./miniprogram
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
