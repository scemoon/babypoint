name: Deploy WeChat Miniprogram

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '2.1.1'
      desc:
        description: 'Version description'
        required: true
        default: 'fix: 创建任务带 childId + 修复 addDays 未定义'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm install miniprogram-ci --registry=https://registry.npmjs.org/
          
      - name: Deploy to WeChat
        run: |
          echo "${{ secrets.WECHAT_PRIVATE_KEY }}" > private_key.pem
          # 注意：miniprogram-ci 的参数名不能想当然：
          #   --version 是 yargs 内置的"显示版本号"，传它会打印版本号后直接退出（空跑）
          #   正确写法是 --upload-version / --upload-description
          #             --project-path / --private-key-path
          npx miniprogram-ci upload \
            --appid ${{ secrets.WECHAT_APPID }} \
            --private-key-path ./private_key.pem \
            --upload-version "${{ github.event.inputs.version || '2.1.1' }}" \
            --upload-description "${{ github.event.inputs.desc || 'fix: 创建任务带 childId + 修复 addDays 未定义' }}" \
            --use-project-config \
            --project-path ./miniprogram
