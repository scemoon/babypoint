name: Deploy WeChat Miniprogram

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '2.0.1'
      desc:
        description: 'Version description'
        required: true
        default: 'Bug fix - remove wx.getUserProfile'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm install miniprogram-ci --registry=https://registry.npmjs.org/
          
      - name: Deploy to WeChat
        run: |
          echo "${{ secrets.WECHAT_PRIVATE_KEY }}" > private_key.pem
          npx miniprogram-ci upload \
            --appid ${{ secrets.WECHAT_APPID }} \
            --private-key ./private_key.pem \
            --version "${{ github.event.inputs.version || '2.0.1' }}" \
            --desc "${{ github.event.inputs.desc || 'Bug fix' }}" \
            --project ./miniprogram
